name: Modal Envoy wrapper

on:
  push:
    branches:
      - modal/v2.4.1-selective-json-parsing
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: modal-envoy-wrapper-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: 459781239556.dkr.ecr.us-east-1.amazonaws.com
  REPOSITORY: envoy-wrapper-1e132cf

jobs:
  build:
    if: github.ref == 'refs/heads/modal/v2.4.1-selective-json-parsing'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup
      - uses: actions/setup-go@v6.2.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3.10.0

      - name: Set image tag
        run: echo "TAG=v2.4.1-selective-json-parsing-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Build Envoy wrapper
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          make envoy-wrapper-docker \
            GOARCH="$ARCH" \
            OUTPUT_DIR="$PWD/_output/modal-$ARCH" \
            IMAGE_REGISTRY="$REGISTRY" \
            ENVOYINIT_IMAGE_REPO="$REPOSITORY" \
            VERSION="$TAG-$ARCH"

      - name: Assume ECR publisher role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::459781239556:role/kgateway-envoy-wrapper-publisher
          aws-region: us-east-1

      - name: Log in to ECR
        run: aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Push image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker push "$REGISTRY/$REPOSITORY:$TAG-$ARCH"

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v3.10.0
      - name: Set image tag
        run: echo "TAG=v2.4.1-selective-json-parsing-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Assume ECR publisher role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::459781239556:role/kgateway-envoy-wrapper-publisher
          aws-region: us-east-1

      - name: Log in to ECR
        run: aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Push multiarch manifest
        run: |
          image="$REGISTRY/$REPOSITORY:$TAG"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
          {
            echo '### Envoy wrapper'
            echo "Image: \`$image\`"
            echo "Manifest-list digest: \`$digest\`"
            echo "Pinned reference: \`$REGISTRY/$REPOSITORY@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
