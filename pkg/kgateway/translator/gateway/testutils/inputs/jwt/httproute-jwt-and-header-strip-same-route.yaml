# JWT claims are written to headers on the same route that strips those
# headers, so the route-level removal runs after jwt_authn has set them.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route
spec:
  parentRefs:
    - name: example-gateway
  hostnames:
    - "example.com"
  rules:
    - matches:
        - headers:
            - type: RegularExpression
              name: content-type
              value: ^application/grpc(-web(-text)?)?([+;].*)?$
          path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-gateway-workspace-id
              - x-gateway-task-id
      backendRefs:
        - name: example-svc
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
spec:
  selector:
    test: test
  ports:
    - protocol: TCP
      port: 80
      targetPort: test
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: http-route-jwt
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: example-route
  jwtAuth:
    extensionRef:
      name: jwt-ext
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: jwt-ext
spec:
  type: JWT
  jwt:
    providers:
    - name: client-auth
      issuer: https://issuer.example.com
      tokenSource:
        header:
          header: x-auth-token
      forwardToken: true
      claimsToHeaders:
        - name: workspace_id
          header: x-gateway-workspace-id
        - name: task_id
          header: x-gateway-task-id
      jwks:
        local:
          inline: |
