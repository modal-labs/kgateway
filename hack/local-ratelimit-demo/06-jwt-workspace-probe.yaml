# A no-op "probe" route that models the Modal input-plane setup:
#   - JWT is required (GatewayExtension + TrafficPolicy.jwtAuth, Strict validation)
#   - the workspace_id claim is copied to x-modal-workspace-id via claimsToHeaders
#   - a local rate limit descriptor keys on that header (JWT runs in the AuthN
#     stage, local rate limit in the RateLimit stage, so the header is visible)
#   - the route is answered by a DirectResponse, never reaching a backend
#
# Requires a ConfigMap "demo-jwks" with key jwks in the demo namespace.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: demo-jwt
  namespace: demo
spec:
  type: JWT
  jwt:
    validationMode: Strict
    providers:
    - name: demo
      issuer: https://modal-demo
      audiences: ["input-plane"]
      tokenSource:
        header:
          header: x-modal-auth-token
      claimsToHeaders:
      - name: workspace_id
        header: x-modal-workspace-id
      jwks:
        local:
          configMapRef:
            name: demo-jwks
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: DirectResponse
metadata:
  name: probe-ok
  namespace: demo
spec:
  status: 200
  body: "probe ok\n"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: probe
  namespace: demo
spec:
  parentRefs:
  - name: demo-gw
  rules:
  - matches:
    - path:
        type: Exact
        value: /modal.client.ModalClient/RateLimitProbe
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.kgateway.dev
        kind: DirectResponse
        name: probe-ok
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: probe-jwt-workspace-ratelimit
  namespace: demo
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: probe
  jwtAuth:
    extensionRef:
      name: demo-jwt
  rateLimit:
    local:
      shareAcrossGateway: true
      alwaysConsumeDefaultTokenBucket: false
      maxDynamicDescriptors: 1000
      tokenBucket:
        maxTokens: 1000
        tokensPerFill: 1000
        fillInterval: 30s
      descriptors:
      - entries:
        - type: Header
          header: x-modal-workspace-id
        tokenBucket:
          maxTokens: 4
          tokensPerFill: 4
          fillInterval: 30s
